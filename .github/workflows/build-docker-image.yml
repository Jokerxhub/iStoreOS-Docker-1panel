name: Build Docker Image
# 此工作流使用非GitHub官方认证的第三方Actions
# 受第三方提供方的独立服务条款、隐私政策以及支持文档约束
on:
  workflow_dispatch:
env:
  # 如果要切换到Docker Hub，此处填写docker.io
  REGISTRY: ghcr.io
  # 镜像名称，自动使用当前仓库名
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # QEMU：用于跨CPU架构编译镜像
      # 项目地址：https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # 初始化BuildKit构建器，用于构建镜像、支持缓存
      # 项目地址：https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 登录ghcr镜像仓库
      # 项目地址：https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 提取镜像元信息，生成镜像标签与label
      # 项目地址：https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 生成两个标签：分支名main，以及latest最新标签
          tags: |
            type=ref,event=branch
            type=raw,value=latest
      # 构建并推送Docker镜像，仅编译x86_64(linux/amd64)架构
      # 项目地址：https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
